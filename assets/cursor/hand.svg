<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wiiperland pointer: an original cartoon hand, index finger up. Hotspot = fingertip. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="1.5" dy="2" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="rotate(-14 13 4)">
    <g fill="url(#skin)" stroke="#5f7184" stroke-width="2.2" stroke-linejoin="round">
      <!-- thumb -->
      <path d="M13 33 C 7 31, 4 35, 6 39 C 8 43, 13 46, 16 47 Z"/>
      <!-- palm -->
      <rect x="12" y="25" width="28" height="30" rx="10"/>
      <!-- curled fingers -->
      <rect x="20" y="22" width="8" height="13" rx="4"/>
      <rect x="27" y="23" width="7.5" height="12" rx="3.75"/>
      <rect x="33.5" y="25" width="7" height="11" rx="3.5"/>
      <!-- index finger -->
      <rect x="11.5" y="1.5" width="9.5" height="31" rx="4.75"/>
    </g>
    <!-- cover the palm/finger seams so the outline reads as one hand -->
    <rect x="13.2" y="27" width="25.6" height="26.5" rx="9" fill="url(#skin)"/>
    <rect x="13.2" y="20" width="6.6" height="12" fill="url(#skin)"/>
    <!-- knuckle creases -->
    <g stroke="#9aaabb" stroke-width="1.4" stroke-linecap="round" fill="none">
      <path d="M27.5 27.5 v4"/>
      <path d="M34 28.5 v3.5"/>
      <path d="M16 11 h1.8"/>
    </g>
    <!-- blue cuff -->
    <path d="M14 51 h24" stroke="#34beed" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
