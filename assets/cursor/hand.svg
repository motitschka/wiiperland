<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wiiperland pointer: an original pointing hand. White glove, dark grey
       outline, a round blue badge with a white "1" on the back of the hand,
       soft drop shadow. Upright, no tilt. Hotspot = fingertip (see
       tools/make-cursor.py). -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcfa"/>
      <stop offset="1" stop-color="#2faee6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="1.4" dy="2.2" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- silhouette: index finger up, three curled fingers, thumb on the left -->
    <path id="hand" d="
      M 20.5 8.5
      A 5 5 0 0 1 30.5 8.5
      L 30.5 26
      A 3.8 3.8 0 0 1 38.1 26
      L 38.1 28
      A 3.6 3.6 0 0 1 45.3 28
      L 45.3 30.6
      A 3.1 3.1 0 0 1 51.5 30.6
      L 51.5 44
      C 51.5 52.5, 48.5 56.5, 46 58.6
      Q 44.6 60, 42.6 60
      L 24.4 60
      Q 22.4 60, 21 58.4
      C 18.4 54.6, 15.6 51, 12.4 47.2
      C 8.4 42.4, 5.6 38.4, 8.2 35
      C 10.6 31.8, 15.2 32.4, 18 35.4
      L 20.5 38
      Z"/>
  </defs>
  <g filter="url(#shadow)" transform="translate(1.5 0.2) scale(0.93)">
    <use href="#hand" fill="url(#skin)" stroke="#34383c" stroke-width="3.3" stroke-linejoin="round"/>
    <!-- where the curled fingers part -->
    <g stroke="#34383c" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M 30.5 26.5 v 6"/>
      <path d="M 38.1 28.5 v 4.6"/>
      <path d="M 45.3 31 v 3.4"/>
    </g>
    <!-- player badge -->
    <circle cx="35.3" cy="46" r="9.6" fill="url(#badge)" stroke="#1f93cc" stroke-width="0.9"/>
    <path d="M 37.6 39.9 L 37.6 52 L 34.2 52 L 34.2 44.3 L 31.6 45.7 L 31.6 42.7 L 35.2 39.9 Z" fill="#ffffff"/>
  </g>
</svg>
